services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    environment:
      PORT: "3001"
      # Ollama runs natively on the Mac so it can use the GPU; Docker on macOS can't.
      OLLAMA_HOST: http://host.docker.internal:11434
      DATABASE_PATH: /data/homer.db
      BACKUP_DIR: /backups
      BACKUP_TIME: ${BACKUP_TIME:-06:00}
      DEPLETION_TIME: ${DEPLETION_TIME:-05:30}
      # A container runs in UTC. The assistant's "today" and "Friday" need the household's own time.
      TZ: ${TZ:-America/Edmonton}
    # Not published: only the web container talks to the api, and HOMER has no login.
    expose:
      - "3001"
    volumes:
      - homer-data:/data
      # A folder on this machine, not the volume, so backups survive losing the volume. Set BACKUP_HOST_DIR to use another folder.
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # This machine only. Phones and tablets reach HOMER over Tailscale: `tailscale serve --bg 3000`.
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  homer-data:
