services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    environment:
      PORT: "3001"
      # Ollama runs natively on the Mac so it can use the GPU; Docker on macOS can't.
      OLLAMA_HOST: http://host.docker.internal:11434
      DATABASE_PATH: /data/homer.db
    ports:
      - "3001:3001"
    volumes:
      - homer-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  homer-data:
