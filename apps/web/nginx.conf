server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's own resolver, asked again every few seconds, so a restarted api (new address) does not leave /trpc on a 502.
  resolver 127.0.0.11 valid=10s;

  location /trpc/ {
    set $api http://api:3001;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    # An assistant reply can take a while on a local model, and one turn can make several model calls.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location / {
    try_files $uri /index.html;
  }
}
